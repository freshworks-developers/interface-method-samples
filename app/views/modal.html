<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script async src="{{{appclient}}}"></script>
    <script async type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
    <script async nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
  </head>
  <body>
    <div class="modal-form" style="padding: 12px;">
      <p style="margin: 0 0 10px; font-size: 13px; color: #12344d;">
        Modal child view — data from parent via <code>client.data.get('ticket')</code>.
      </p>
      <fw-input label="Note" id="modal-note" placeholder="Optional note"></fw-input>
      <p id="modal-ticket" style="margin: 10px 0 0; font-size: 12px; color: #6b7c93;">Loading ticket…</p>
    </div>
    <script>
      (async function () {
        try {
          const client = await app.initialized();
          const data = await client.data.get('ticket');
          const el = document.getElementById('modal-ticket');
          if (el && data?.ticket?.id) {
            el.textContent = 'Ticket #' + data.ticket.id;
          } else if (el) {
            el.textContent = 'No ticket context in modal.';
          }
        } catch (error) {
          console.error('Modal init failed', error);
        }
      })();
    </script>
  </body>
</html>
